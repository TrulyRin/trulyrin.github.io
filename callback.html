<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depths Saviors | Authenticating...</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://cdn.discordapp.com/avatars/1373795045529878560/a_8bf1675cdc4f6feb3181f2d90562b4d9.gif?size=1024&animated=true" type="image/gif">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 20px;
        }
        .auth-spinner {
            width: 48px; height: 48px;
            border: 4px solid var(--border-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .auth-text { color: var(--text-muted); font-size: 1.1rem; }
        .auth-error { color: #E63946; font-size: 1rem; max-width: 400px; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-spinner" id="spinner"></div>
        <p class="auth-text" id="status">Authenticating with Discord...</p>
        <p class="auth-error" id="error" style="display:none;"></p>
    </div>
    <script>
        // Retired implicit dashboard callback: discard legacy tokens and use server-side sign-in.
        history.replaceState(null, '', '/callback');
        for (const key of ['ds_token', 'ds_token_type', 'ds_token_ts']) localStorage.removeItem(key);
        window.location.replace('/dashboard');
    </script>
</body>
</html>
