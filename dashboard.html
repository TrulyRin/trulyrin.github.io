<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your Depths Saviors bot settings from the web dashboard.">
    <title>Dashboard | Depths Saviors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="https://cdn.discordapp.com/avatars/1373795045529878560/a_8bf1675cdc4f6feb3181f2d90562b4d9.gif?size=1024&animated=true" type="image/gif">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo-group">
                <img src="https://cdn.discordapp.com/avatars/1373795045529878560/a_8bf1675cdc4f6feb3181f2d90562b4d9.gif?size=1024&animated=true" class="logo-img">
                <span class="logo-text">Depths Saviors</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/joinds" class="nav-link">Join</a>
                <a href="/bot" class="nav-link">Bot Guide</a>
                <a href="/dashboard" class="nav-link active">Dashboard</a>
                <a href="https://discord.gg/deepsaviors" class="discord-btn" target="_blank">
                    <i class="fab fa-discord"></i> Server
                </a>
                <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <div class="dash-app" id="app">
        <!-- LOGIN VIEW -->
        <div id="view-login" class="view-login" style="display:none;">
            <div class="login-card">
                <img src="https://cdn.discordapp.com/avatars/1373795045529878560/a_8bf1675cdc4f6feb3181f2d90562b4d9.gif?size=1024&animated=true" style="width:72px;height:72px;border-radius:50%;margin-bottom:20px;border:3px solid var(--primary);">
                <h1>Bot Dashboard</h1>
                <p>Login with Discord to manage your server's bot settings, gank notifications, and more.</p>
                <a id="login-btn" class="login-btn" href="#"><i class="fab fa-discord"></i> Login with Discord</a>
            </div>
        </div>

        <!-- SERVER SELECTOR VIEW -->
        <div id="view-servers" style="display:none;" class="view-servers">
            <div class="servers-header">
                <div class="user-bar" id="user-bar"></div>
                <h1>Select a Server</h1>
                <p>Showing servers where you have Administrator and the bot is active.</p>
            </div>
            <div class="server-grid" id="server-grid"></div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" style="display:none;" class="view-dashboard">
            <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
            <aside class="dash-sidebar" id="dash-sidebar">
                <div class="sidebar-guild" id="sidebar-guild"></div>
                <div class="cog-nav" id="cog-nav"></div>
            </aside>
            <main class="dash-content" id="dash-content"></main>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="dashboard.js?v=3"></script>
    <script>
        function initTheme(){const s=localStorage.getItem('theme')||'dark';document.body.setAttribute('data-theme',s);updateIcon(s);}
        function toggleTheme(){const b=document.body,c=b.getAttribute('data-theme'),n=c==='light'?'dark':'light';b.setAttribute('data-theme',n);localStorage.setItem('theme',n);updateIcon(n);}
        function updateIcon(t){const i=document.querySelector('.theme-toggle i');if(i)i.className=t==='light'?'fas fa-sun':'fas fa-moon';}
        document.addEventListener('DOMContentLoaded',()=>{initTheme();DS.init();});
    </script>
</body>
</html>
